---
- name: Install Firefox on Windows
  hosts: all
  gather_facts: no

  tasks:

    - name: Download Firefox installer
      ansible.windows.win_get_url:
        url: "https://download.mozilla.org/?product=firefox-latest-ssl&os=win64&lang=en-US"
        dest: "C:\Windows\Temp\FirefoxSetup.exe"

    - name: Install Firefox
      ansible.windows.win_package:
        path: "C:\Windows\Temp\FirefoxSetup.exe"
        arguments: "/S"
        state: present

    - name: Check Firefox installation
      ansible.windows.win_stat:
        path: "C:\Program Files\Mozilla Firefox\firefox.exe"
      register: firefox_check

    - name: Display installation result
      ansible.builtin.debug:
        msg: "Firefox installed: {{ firefox_check.stat.exists }}"